<svg xmlns="http://www.w3.org/2000/svg" width="480" height="220" viewBox="0 0 480 220" fill="none">
  <defs>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6e40c9"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="cardBg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="borderGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#6e40c9" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  
  <rect x="2" y="2" width="476" height="216" rx="14" fill="url(#cardBg2)" stroke="url(#borderGrad2)" stroke-width="1.8"/>
  
  <text x="24" y="27" fill="#f0f6fc" font-family="'Segoe UI', -apple-system, sans-serif" font-size="13" font-weight="700">⚡ Core Competency Proficiency</text>
  <text x="410" y="27" fill="#8b949e" font-family="'Segoe UI', monospace" font-size="11">INDEX</text>
  <line x1="16" y1="38" x2="464" y2="38" stroke="#30363d" stroke-width="1"/>
  
  <g transform="translate(24, 52)" font-family="'Segoe UI', -apple-system, sans-serif">
    <!-- Row 1: Full-Stack Dev -->
    <text x="0" y="14" fill="#c9d1d9" font-size="11.5" font-weight="600">Full-Stack Web Dev (React/Node/Go/Python)</text>
    <rect x="0" y="20" width="430" height="6" rx="3" fill="#21262d"/>
    <rect x="0" y="20" width="425" height="6" rx="3" fill="url(#barGrad)"/>
    <text x="405" y="14" fill="#a855f7" font-size="11" font-weight="700">99%</text>

    <!-- Row 2: Reverse Engineering -->
    <text x="0" y="44" fill="#c9d1d9" font-size="11.5" font-weight="600">Reverse Engineering &amp; Binary Analysis (IDA/Frida)</text>
    <rect x="0" y="50" width="430" height="6" rx="3" fill="#21262d"/>
    <rect x="0" y="50" width="418" height="6" rx="3" fill="url(#barGrad)"/>
    <text x="405" y="44" fill="#a855f7" font-size="11" font-weight="700">98%</text>

    <!-- Row 3: Anti-Bot & Protocol -->
    <text x="0" y="74" fill="#c9d1d9" font-size="11.5" font-weight="600">Anti-Bot &amp; Protocol Engineering (TLS/JA4/H2)</text>
    <rect x="0" y="80" width="430" height="6" rx="3" fill="#21262d"/>
    <rect x="0" y="80" width="430" height="6" rx="3" fill="url(#barGrad)"/>
    <text x="400" y="74" fill="#a855f7" font-size="11" font-weight="700">100%</text>

    <!-- Row 4: Bug Hunting -->
    <text x="0" y="104" fill="#c9d1d9" font-size="11.5" font-weight="600">Bug Hunting, Pentesting &amp; Software Cracking</text>
    <rect x="0" y="110" width="430" height="6" rx="3" fill="#21262d"/>
    <rect x="0" y="110" width="415" height="6" rx="3" fill="url(#barGrad)"/>
    <text x="405" y="104" fill="#a855f7" font-size="11" font-weight="700">97%</text>

    <!-- Row 5: Low-Level / Hardware -->
    <text x="0" y="134" fill="#c9d1d9" font-size="11.5" font-weight="600">Assembly (x86/x64/ARM) &amp; Hardware Hacking</text>
    <rect x="0" y="140" width="430" height="6" rx="3" fill="#21262d"/>
    <rect x="0" y="140" width="410" height="6" rx="3" fill="url(#barGrad)"/>
    <text x="405" y="134" fill="#a855f7" font-size="11" font-weight="700">96%</text>
